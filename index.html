<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0c1207" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Lime Unlocker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛴</text></svg>" />
<style>
:root{--bg:#0b0f0a;--panel:#141a12;--panel2:#1b2318;--line:#2b3724;--fg:#e9f3e3;
--dim:#95a68b;--accent:#a6ff4d;--accent2:#79d321;--danger:#ff6b60;--ok:#3ddc84;--warn:#ffc247}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 520px at 50% -12%,#1e2c15 0%,var(--bg) 62%) fixed;
color:var(--fg);-webkit-text-size-adjust:100%;
font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding:16px 14px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
h1{font-size:19px;margin:0;letter-spacing:-.3px;flex:1}
.pill{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 9px;
border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.on{color:#0b0f0a;background:var(--accent);border-color:var(--accent)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 10px}
.mini{font-size:11px}
input[type=text],select{width:100%;margin-top:5px;background:#0d120b;color:var(--fg);
border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;
font-family:ui-monospace,Menlo,monospace;-webkit-appearance:none;appearance:none}
input[type=text]{text-transform:uppercase}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent2)}
input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--accent2);height:26px}
.row{display:flex;gap:9px}.row>*{flex:1}
button{font:inherit;font-weight:650;border-radius:12px;border:1px solid var(--line);background:#1a2316;
color:var(--fg);padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.985)}button:disabled{opacity:.35}
button.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#0b0f0a;border-color:transparent}
button.ghost{background:transparent;color:var(--dim)}
button.xl{padding:18px;font-size:17px}button.big{padding:16px 10px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hint{font-size:11.5px;color:var(--dim);margin:11px 0 0;line-height:1.5}
.hint code{background:#0d120b;padding:1px 5px;border-radius:5px;font-size:11px}
.spd{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--fg)}
.spd b{font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:13px 0}
details.card{padding:0}
details.card>summary{padding:14px;cursor:pointer;font-size:12px;letter-spacing:1.2px;
text-transform:uppercase;color:var(--dim);list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸ ";color:var(--accent2)}
details.card[open]>summary::before{content:"▾ "}
.dbody{padding:0 14px 14px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--fg);margin:9px 0}
.chk input{width:19px;height:19px;margin:0;accent-color:var(--accent2)}
#log{height:250px;overflow:auto;background:#080b07;border:1px solid var(--line);border-radius:10px;
padding:9px;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-overflow-scrolling:touch}
.ln{display:flex;gap:8px;word-break:break-all}
.ln .t{color:#485840;flex:none}
.ln.tx .m{color:var(--accent)}.ln.rx .m{color:#6cc7ff}.ln.err .m{color:var(--danger)}
.ln.ok .m{color:var(--ok)}.ln.dim .m{color:var(--dim)}.ln.warn .m{color:var(--warn)}
</style>
</head>
<body>

<header><h1>🛴 Lime Unlocker</h1><div id="status" class="pill">off</div></header>

<section class="card">
  <button id="btnConnect" class="primary xl">Connect</button>
  <label class="mini" style="margin-top:10px">Extra service UUIDs (optional)
    <input id="extra" type="text" placeholder="ffe0 fff0" autocapitalize="off" autocorrect="off" spellcheck="false" /></label>
  <div class="grid" style="margin-top:4px">
    <button id="btnUnlock" class="primary big" disabled>Unlock</button>
    <button id="btnLock" class="big" disabled>Lock</button>
    <button id="btnBeep" class="big" disabled>Beep</button>
    <button id="btnDisconnect" class="big ghost" disabled>Disconnect</button>
  </div>
</section>

<section class="card">
  <h2>Tune</h2>
  <label><div class="spd"><span>Speed limit</span><b id="spdVal">25</b><span>km/h</span></div>
    <input id="spd" type="range" min="5" max="30" step="1" value="25" disabled /></label>
  <div class="row">
    <label class="mini" style="flex:1">Register <input id="spdReg" type="text" value="0D" /></label>
    <button id="btnSpd" class="ghost" style="flex:.8;align-self:flex-end;margin-bottom:10px" disabled>Apply</button>
  </div>
  <div class="sep"></div>
  <div class="row">
    <button id="btnBlink" class="ghost" disabled>Blink light</button>
    <button id="btnRead" class="ghost" disabled>Read register</button>
  </div>
  <label class="mini" style="margin-top:10px">Read register # <input id="readReg" type="text" value="0D" /></label>
  <div class="sep"></div>
  <label class="mini">Custom frame — cmd <input id="cCmd" type="text" value="1663" /></label>
  <label class="mini">payload (hex, optional) <input id="cPay" type="text" placeholder="F1" /></label>
  <button id="btnCustom" class="ghost" disabled>Send frame</button>
</section>

<details class="card" open>
  <summary>Diagnose</summary>
  <div class="dbody">
    <label>Write characteristic <select id="writeSel"><option value="">— none —</option></select></label>
    <label>Write mode
      <select id="writeMode">
        <option value="auto">Auto</option>
        <option value="resp">With response</option>
        <option value="noresp">Without response</option>
      </select></label>
    <div class="chk"><input type="checkbox" id="optBroadcast" /><span>Broadcast to every writable characteristic</span></div>
    <div class="chk"><input type="checkbox" id="optKeepAlive" /><span>Keep-alive ping every 2 s</span></div>
    <div class="chk"><input type="checkbox" id="optAutoReconnect" checked /><span>Auto-reconnect and retry the last command</span></div>
    <button id="btnShotgun" class="ghost" disabled>Shotgun test (fires 10 command formats)</button>
    <p class="hint">GATT tree is dumped to the log on connect. Copy it if you need to compare.</p>
  </div>
</details>

<section class="card">
  <h2>Log</h2>
  <div id="log"></div>
  <div class="row" style="margin-top:8px">
    <button id="btnClear" class="ghost">Clear</button>
    <button id="btnCopy" class="ghost">Copy log</button>
  </div>
</section>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const logEl = $('#log');

const SERVICES = ['6e400001-b5a3-f393-e0a9-e50e24dcca9e','0000ffe0-0000-1000-8000-00805f9b34fb',
'0000ffe5-0000-1000-8000-00805f9b34fb','0000ffe9-0000-1000-8000-00805f9b34fb',
'0000fff0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb',
'49535343-fe7d-4ae5-8fa9-9fafd205e455','0000fee7-0000-1000-8000-00805f9b34fb',
'0000fee9-0000-1000-8000-00805f9b34fb','0000fe95-0000-1000-8000-00805f9b34fb'];

let device = null, server = null, writeChar = null, writables = [], keepTimer = null;
let connectedAt = 0, lastWriteAt = 0, manualDrop = false, reconnectTries = 0, pending = null;
const enc = new TextEncoder();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const toHex = b => Array.from(b).map(x => x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
const toAscii = b => Array.from(b).map(x => (x>=32&&x<127)?String.fromCharCode(x):'.').join('');

function log(msg, cls) {
  const d = document.createElement('div');
  d.className = 'ln' + (cls ? ' ' + cls : '');
  const t = document.createElement('span'); t.className='t';
  t.textContent = new Date().toTimeString().slice(0,8);
  const m = document.createElement('span'); m.className='m'; m.textContent = msg;
  d.append(t,m); logEl.append(d);
  while (logEl.children.length > 700) logEl.firstChild.remove();
  logEl.scrollTop = logEl.scrollHeight;
}
const logBytes = (dir,b) => log(`${dir} ${toHex(b)}${b.length<=40?'  |'+toAscii(b)+'|':''}`, dir==='>>'?'tx':'rx');

/* CRC-16/XMODEM */
function crc16(buf){let c=0;for(const b of buf){c^=b<<8;
  for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c;}
function frame(cmd,payload=[]){const n=payload.length,f=new Uint8Array(8+n);
  f[0]=0x46;f[1]=0x43;f[2]=(cmd>>8)&0xFF;f[3]=cmd&0xFF;f[4]=(n>>8)&0xFF;f[5]=n&0xFF;
  f.set(payload,6);const c=crc16(f.subarray(0,6+n));
  f[6+n]=(c>>8)&0xFF;f[7+n]=c&0xFF;return f;}
function parseHex(s){const h=(s||'').replace(/0x/gi,'').replace(/[^0-9a-f]/gi,'');
  if(h.length%2)throw new Error('odd hex');const o=new Uint8Array(h.length/2);
  for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}
const hexNum=s=>{const t=(s||'').replace(/[^0-9a-f]/gi,'');if(!t)return null;
  const v=parseInt(t,16);return isNaN(v)?null:v;};
const normUuid=u=>{u=(u||'').trim().toLowerCase();
  if(/^[0-9a-f]{4}$/.test(u))return '0000'+u+'-0000-1000-8000-00805f9b34fb';
  if(/^[0-9a-f]{8}$/.test(u))return u+'-0000-1000-8000-00805f9b34fb';return u;};

/* self-test */
(() => {
  const v=[[frame(0x1114,[]),'46 43 11 14 00 00 EA FB'],
           [frame(0x1663,[0xF0]),'46 43 16 63 00 01 F0 0F C6'],
           [frame(0x1663,[0xF1]),'46 43 16 63 00 01 F1 1F E7'],
           [frame(0x1613,[0xF1]),'46 43 16 13 00 01 F1 5D 92'],
           [frame(0x1101,parseHex('4C494D4542494B45')),
            '46 43 11 01 00 08 4C 49 4D 45 42 49 4B 45 BE 8A']];
  let p=0; for(const [g,w] of v) if(toHex(g)===w) p++;
  log(`Self-test: ${p}/${v.length} frame vectors ${p===v.length?'PASS':'FAIL'}`, p===v.length?'ok':'err');
})();

/* ── attach: discover, subscribe, pick target ── */
async function attach() {
  const extra = ($('#extra').value||'').split(/[\s,]+/).filter(Boolean).map(normUuid);
  server = await device.gatt.connect();
  connectedAt = Date.now();
  $('#status').className='pill on'; $('#status').textContent = device.name || 'connected';
  log(`Connected to ${device.name||'device'}. Dumping GATT…`);

  let services = [];
  try { services = await server.getPrimaryServices(); } catch(e){ log('getPrimaryServices: '+e.message,'warn'); }
  if (!services.length)
    for (const u of [...new Set([...SERVICES,...extra])])
      { try { services.push(await server.getPrimaryService(u)); } catch(_){} }

  writables = [];
  let notifyCount = 0, readable = null;
  for (const s of services) {
    let chars = [];
    try { chars = await s.getCharacteristics(); } catch(_){ log(`  SVC ${s.uuid} (no access)`,'dim'); continue; }
    log(`SVC ${s.uuid}`, 'dim');
    for (const ch of chars) {
      const p = ch.properties || {};
      const props = ['read','write','writeWithoutResponse','notify','indicate'].filter(k=>p[k]);
      log(`   CHR ${ch.uuid} [${props.join(' ')||'—'}]`, 'dim');
      if (p.read && !readable) readable = ch;
      if (p.notify || p.indicate) {
        notifyCount++;
        ch.startNotifications().then(() => ch.addEventListener('characteristicvaluechanged', e => {
          const v = e.target.value;
          logBytes('<<', new Uint8Array(v.buffer, v.byteOffset, v.byteLength));
        })).catch(()=>{});
      }
      if (p.write || p.writeWithoutResponse) writables.push(ch);
    }
  }

  const sel = $('#writeSel'); sel.innerHTML = '<option value="">— none —</option>';
  writables.forEach((c,i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = `${c.uuid.slice(0,8)} (${c.service.uuid.slice(0,8)})${c.properties.write?' W':' w/o'}`;
    sel.append(o);
  });
  if (writables.length) sel.value = '0';
  writeChar = writables[0] || null;
  log(`${services.length} svc, ${writables.length} writable, ${notifyCount} notifying.`, 'dim');

  if (!writeChar) { log('No writable characteristic — add UUIDs and reconnect.', 'err'); return; }

  /* settle: peripherals often drop a client that writes too early */
  await sleep(1200);
  if (readable && $('#optKeepAlive').checked) {
    keepTimer = setInterval(() => readable.readValue().catch(()=>{}), 2000);
  }
  log('Ready.', 'ok');
  setEnabled(true);

  if (pending && reconnectTries < 3) {
    reconnectTries++;
    log(`Replaying "${pending}" (attempt ${reconnectTries})`, 'warn');
    const p = pending; pending = null;
    await action(p, true);
  }
}

async function connect() {
  if (!navigator.bluetooth) return log('No Web Bluetooth. Use Bluefy or Chrome.','err');
  const extra = ($('#extra').value||'').split(/[\s,]+/).filter(Boolean).map(normUuid);
  try {
    $('#btnConnect').disabled = true;
    manualDrop = false;
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true, optionalServices: [...new Set([...SERVICES,...extra])] });
    log(`Selected ${device.name || '(unnamed)'}  id=${device.id}`);
    device.addEventListener('gattserverdisconnected', onDrop);
    await attach();
  } catch(e) {
    log('Connect failed: ' + e.message, 'err');
    $('#status').className='pill'; $('#status').textContent='off';
  } finally { $('#btnConnect').disabled = false; }
}

async function onDrop() {
  const alive = ((Date.now()-connectedAt)/1000).toFixed(1);
  const since = lastWriteAt ? ((Date.now()-lastWriteAt)/1000).toFixed(2)+'s' : 'never';
  log(`!! DISCONNECTED after ${alive}s of link (last write: ${since} ago)`, 'err');
  $('#status').className='pill'; $('#status').textContent='off';
  writeChar = null; setEnabled(false);
  if (keepTimer) { clearInterval(keepTimer); keepTimer = null; }

  if (manualDrop || !$('#opt
